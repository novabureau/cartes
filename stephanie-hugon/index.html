<style>
:root{--cream:#f8e6d5;--ink:#4a2f12;--ink2:#6e4c22;--gold:#b48535;--gold-d:#8a6224;--soft:#a88a64}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);overflow-x:hidden}
body{font-family:"Jost",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100vh}
a{color:inherit;text-decoration:none}
.page{position:relative;width:100%;max-width:430px;padding:30px 30px 56px;text-align:center;overflow:hidden}
.swirl{position:absolute;left:0;width:100%;pointer-events:none}
.swirl.top{top:0}
.swirl.bot{bottom:0;transform:rotate(180deg)}

.logo{position:relative;display:block;width:210px;max-width:60%;height:auto;margin:14px auto 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 7%,#000 93%,transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 7%,#000 93%,transparent);
  mask-composite:intersect}

h1{margin-top:22px;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:46px;line-height:1;letter-spacing:.01em}
.role{margin-top:12px;font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:22px;line-height:1.25;color:var(--ink2)}
.beat{display:block;width:100%;height:26px;margin:22px auto 0}

.lines{margin:18px auto 0;display:inline-flex;flex-direction:column;gap:18px;text-align:left}
.line{display:flex;align-items:center;gap:16px;font-weight:400;font-size:20px;letter-spacing:.02em}
.ring{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--gold-d);
  border:1.5px solid var(--gold);box-shadow:inset 0 0 0 3px var(--cream),inset 0 0 0 4px rgba(180,133,53,.35)}
.ring svg{width:17px;height:17px}
.line small{display:block;font-family:"Cinzel",serif;font-size:9.5px;letter-spacing:.24em;color:var(--soft);margin-bottom:1px}
.line.mail{font-size:18px}

.save{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:34px;padding:17px 30px;border-radius:999px;
  background:linear-gradient(120deg,#8a6224,#c9a058 30%,#f1d89c 52%,#c9a058 74%,#8a6224);background-size:220% 100%;
  color:#fffaf1;font-family:"Cinzel",serif;font-weight:600;font-size:13px;letter-spacing:.16em;text-shadow:0 1px 1px rgba(74,47,18,.4);
  box-shadow:0 12px 26px -14px rgba(138,98,36,.9);transition:background-position .6s}
.save:hover{background-position:100% 0}
.save svg{width:18px;height:18px}

.more{display:flex;justify-content:center;gap:34px;margin-top:28px}
.more a,.more button{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--ink2);
  font:400 13px "Jost",sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.more .ring{width:48px;height:48px}
.more .ring svg{width:20px;height:20px}

.house{margin-top:46px}
.house .name{display:flex;align-items:center;gap:14px;font-family:"Cinzel",serif;font-weight:600;font-size:17px;letter-spacing:.32em;color:var(--ink)}
.house .name::before,.house .name::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.house .name::after{background:linear-gradient(90deg,var(--gold),transparent)}
.house p{margin-top:12px;font-family:"Cinzel",serif;font-size:10.5px;line-height:2;letter-spacing:.2em;color:var(--ink2)}
.house p i{font-style:normal;color:var(--gold);padding:0 .35em}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--ink);color:#fbe9cf;font-size:14px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<div class="toast" id="toast">Lien copié</div>
<script>
(function(){
  var url=location.href.split('#')[0].split('?')[0],t=document.getElementById('toast');
  function toast(m){t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1800)}
  function fallback(){var i=document.createElement('input');i.value=url;document.body.appendChild(i);i.select();try{document.execCommand('copy');toast('Lien copié')}catch(e){}i.remove()}
  function copy(){if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){toast('Lien copié')},fallback)}else fallback()}
  document.getElementById('copy').onclick=copy;
  document.getElementById('share').onclick=function(){
    if(navigator.share){navigator.share({title:'Stéphanie Hugon · AHOMI World',text:'Carte de visite de Stéphanie Hugon — AHOMI World Group',url:url}).catch(function(){})}else copy();
  };
})();
</script>
