<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stéphanie Hugon · AHOMI World</title>
<meta name="description" content="Stéphanie Hugon, Chief Operating Officer for Development — AHOMI World Group, fondé par Isabelle Bartoli.">
<meta property="og:title" content="Stéphanie Hugon · AHOMI World">
<meta property="og:description" content="Chief Operating Officer for Development — AHOMI World Group">
<meta name="theme-color" content="#f8e6d5">
<link rel="icon" href="icon.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8e6d5;--ink:#3f2a14;--soft:#8c7154;--gold:#b48535}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:"Jost",system-ui,sans-serif;font-weight:300;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100vh}
a{color:inherit;text-decoration:none}
.page{width:100%;max-width:400px;padding:56px 32px 48px;text-align:center;display:flex;flex-direction:column;min-height:100vh}
.logo{display:block;width:150px;height:auto;margin:0 auto;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 7%,#000 93%,transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 7%,#000 93%,transparent);
  mask-composite:intersect}
h1{margin-top:44px;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:40px;line-height:1.05;letter-spacing:.01em}
.role{margin-top:10px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px;color:var(--soft)}
.rule{width:36px;height:1px;background:var(--gold);margin:36px auto}
.contact{display:flex;flex-direction:column;gap:14px;font-size:17px;letter-spacing:.03em}
.contact a{display:block}
.contact span{display:block;font-family:"Cinzel",serif;font-size:9px;letter-spacing:.3em;color:var(--soft);margin-bottom:3px}
.save{display:inline-block;margin:44px auto 0;padding:15px 34px;border:1px solid var(--gold);border-radius:999px;
  font-family:"Cinzel",serif;font-size:11.5px;letter-spacing:.22em;color:var(--ink);transition:background .25s,color .25s}
.save:hover,.save:active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.links{margin-top:22px;font-size:13.5px;color:var(--soft);letter-spacing:.04em}
.links a,.links button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:4px 2px;border-bottom:1px solid transparent}
.links a:hover,.links button:hover{border-bottom-color:var(--soft)}
.links i{font-style:normal;padding:0 10px;color:var(--gold)}
footer{margin-top:auto;padding-top:64px}
footer .house{font-family:"Cinzel",serif;font-size:12px;letter-spacing:.34em}
footer .founder{margin-top:12px;line-height:1.3;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:16px;color:var(--soft)}
footer .founder b{font-style:normal;font-weight:500;color:var(--ink)}
footer .pillars{margin-top:16px;font-family:"Cinzel",serif;font-size:8.5px;letter-spacing:.24em;color:var(--soft);line-height:2}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="page">
  <img class="logo" src="logo.webp" alt="AHOMI World" width="520" height="547">

  <h1>Stéphanie Hugon</h1>
  <p class="role">Chief Operating Officer for Development</p>

  <div class="rule"></div>

  <div class="contact">
    <a href="tel:+212677361663"><span>MAROC</span>+212 6 77 36 16 63</a>
    <a href="tel:+33627035688"><span>FRANCE</span>+33 6 27 03 56 88</a>
    <a href="mailto:ahomiworld@gmail.com"><span>EMAIL</span>ahomiworld@gmail.com</a>
  </div>

  <a class="save" href="contact.vcf" download="Stephanie-Hugon.vcf">ENREGISTRER LE CONTACT</a>

  <p class="links">
    <a href="https://wa.me/212677361663?text=Bonjour%20St%C3%A9phanie%2C%20" target="_blank" rel="noopener">WhatsApp</a><i>·</i><button type="button" id="share">Partager</button>
  </p>

  <footer>
    <div class="house">AHOMI WORLD GROUP</div>
    <p class="founder"><b>Isabelle Bartoli</b><br>Designer &amp; Founder</p>
    <p class="pillars">ART · ARCHITECTURE · WELL-BEING<br>TECHNOLOGIE · INNOVATION</p>
  </footer>
</main>
<div class="toast" id="toast">Lien copié</div>
<script>
(function(){
  var url=location.href.split('#')[0].split('?')[0],t=document.getElementById('toast');
  function copy(){try{navigator.clipboard.writeText(url).then(function(){t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1800)})}catch(e){}}
  document.getElementById('share').onclick=function(){
    if(navigator.share){navigator.share({title:'Stéphanie Hugon · AHOMI World',url:url}).catch(function(){})}else copy();
  };
})();
</script>
</body>
</html>
