<style>
:root{--bg:#f8e6d5;--ink:#3f2a14;--soft:#8c7154;--gold:#a8844f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:"Jost",system-ui,sans-serif;font-weight:300;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100vh}
a{color:inherit;text-decoration:none}
.page{width:100%;max-width:400px;padding:44px 28px 40px;text-align:center}
.emblem{display:block;width:132px;height:auto;margin:0 auto}
.word{margin-top:14px;font-family:"Cinzel",serif;font-weight:500;font-size:30px;letter-spacing:.2em;padding-left:.2em;color:var(--gold);line-height:1}
.world{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;font-family:"Cinzel",serif;font-size:12px;letter-spacing:.5em;padding-left:.5em;color:var(--gold)}
.world::before,.world::after{content:"";width:34px;height:1px;background:var(--gold)}
.founder{margin-top:18px;font-family:"Cormorant Garamond",serif;font-size:22px;line-height:1.2}
.founder em{display:block;font-size:17px;color:var(--soft)}
.rule{width:36px;height:1px;background:var(--gold);margin:28px auto}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:40px;line-height:1.05;letter-spacing:.01em}
.role{margin-top:8px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px;color:var(--soft)}
.contact{margin-top:28px;display:flex;flex-direction:column;gap:13px;font-size:17px;letter-spacing:.03em}
.contact a{display:block}
.contact span{display:block;font-family:"Cinzel",serif;font-size:9px;letter-spacing:.3em;color:var(--soft);margin-bottom:3px}
.save{display:inline-block;margin:34px auto 0;padding:15px 34px;border:1px solid var(--gold);border-radius:999px;
  font-family:"Cinzel",serif;font-size:11.5px;letter-spacing:.22em;color:var(--ink);transition:background .25s,color .25s}
.save:hover,.save:active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.links{margin-top:18px;font-size:13.5px;color:var(--soft);letter-spacing:.04em}
.links a,.links button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:4px 2px}
.links i{font-style:normal;padding:0 10px;color:var(--gold)}
.pillars{margin-top:34px;font-family:"Cinzel",serif;font-size:8.5px;letter-spacing:.24em;color:var(--soft);line-height:2}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
