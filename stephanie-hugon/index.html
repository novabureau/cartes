<style>
:root{
  --cream:#f8e6d5; --cream-2:#fdf3e9; --paper:#fffaf4;
  --gold:#b98a3e; --gold-l:#e6c27a; --gold-d:#8a6224;
  --brown:#4a2f12; --brown-2:#6b4a24; --mute:#9a7d5c;
  --line:rgba(185,138,62,.28);
  --goldgrad:linear-gradient(135deg,#8a6224 0%,#c9a058 28%,#f3dca0 50%,#c9a058 72%,#8a6224 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--cream);overflow-x:hidden}
body{font-family:"Jost",system-ui,sans-serif;color:var(--brown);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:var(--cream);display:flex;justify-content:center;overflow-x:hidden}
.wrap{position:relative;width:100%;max-width:440px;padding:0 0 44px;overflow:hidden}

/* gold ribbons */
.ribbon{position:absolute;pointer-events:none;z-index:0}
.ribbon.tl{left:-40px;top:-10px;width:130px}

.hero{position:relative;z-index:1;text-align:center;padding:26px 24px 0}
.logo{display:block;width:230px;max-width:62%;height:auto;margin:0 auto}

.id{margin-top:18px}
h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:44px;line-height:1.02;color:var(--brown);letter-spacing:.005em}
.role{margin-top:10px;font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:22px;line-height:1.2;color:var(--brown-2)}
.org{margin-top:12px;font-family:"Cinzel",serif;font-size:11.5px;letter-spacing:.32em;color:var(--gold-d);font-weight:600}

.pulse{display:block;width:100%;max-width:330px;height:28px;margin:18px auto 0}

/* CTA */
.cta{position:relative;z-index:1;margin:22px 20px 0;display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:16px;
  background:var(--goldgrad);background-size:200% 100%;background-position:0 0;color:#fffaf2;text-decoration:none;
  font-family:"Cinzel",serif;font-weight:600;font-size:14px;letter-spacing:.14em;text-shadow:0 1px 1px rgba(74,47,18,.45);
  box-shadow:0 10px 24px -10px rgba(138,98,36,.7),inset 0 1px 0 rgba(255,255,255,.5);transition:background-position .5s,transform .15s}
.cta:hover{background-position:100% 0}
.cta:active{transform:scale(.985)}
.cta svg{width:19px;height:19px}

/* quick actions */
.quick{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 20px 0}
.q{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px 12px;border-radius:15px;background:rgba(255,250,244,.75);
  border:1px solid var(--line);color:var(--brown);text-decoration:none;font-size:12.5px;font-weight:500;backdrop-filter:blur(4px);
  font-family:"Jost",sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
.q:active{background:#f3dcc4}
.q svg{width:22px;height:22px;color:var(--gold)}

/* contact card */
.card{position:relative;z-index:1;margin:24px 20px 0;border-radius:20px;background:var(--paper);overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 16px 36px -22px rgba(138,98,36,.55);border:1px solid var(--line)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--goldgrad)}
.row{display:flex;align-items:center;gap:14px;padding:16px;color:var(--brown);text-decoration:none;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:#fbefe1}
.ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--gold-d);
  background:radial-gradient(circle at 35% 30%,#fff6e3,#f1d9ad);border:1px solid rgba(185,138,62,.45)}
.ic svg{width:18px;height:18px}
.tx{min-width:0;flex:1}
.lb{display:block;font-family:"Cinzel",serif;font-size:10.5px;letter-spacing:.2em;color:var(--mute);font-weight:600}
.vl{display:block;margin-top:3px;font-size:16.5px;font-weight:500;letter-spacing:.01em;overflow-wrap:anywhere}
.chev{flex:none;width:15px;height:15px;color:#c8ad86}

/* pillars */
.sec{position:relative;z-index:1;margin:30px 20px 0;text-align:center}
.sec h2{display:flex;align-items:center;gap:14px;font-family:"Cinzel",serif;font-size:13px;letter-spacing:.34em;color:var(--brown);font-weight:600}
.sec h2::before,.sec h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.sec h2::after{background:linear-gradient(90deg,var(--gold),transparent)}
.pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.p{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:14px;background:rgba(255,250,244,.7);border:1px solid var(--line);text-align:left}
.p:last-child{grid-column:1/-1;justify-content:center}
.p svg{flex:none;width:20px;height:20px;color:var(--gold)}
.p span{font-family:"Cinzel",serif;font-size:11.5px;letter-spacing:.14em;font-weight:600;color:var(--brown-2)}

/* share */
.share{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 20px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;border:1px solid rgba(185,138,62,.5);background:transparent;
  color:var(--brown);font:500 15px "Jost",sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{background:#f3dcc4}
.btn svg{width:18px;height:18px;color:var(--gold)}

footer{position:relative;z-index:1;margin:34px 20px 0;text-align:center}
footer .w{font-family:"Cinzel",serif;font-size:14px;letter-spacing:.36em;color:var(--gold-d);font-weight:600}
footer .s{margin-top:8px;font-family:"Cinzel",serif;font-size:9.5px;letter-spacing:.22em;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--brown);color:#fbe9cf;font-size:14px;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

<div class="toast" id="toast">Lien copié</div>
<script>
(function(){
  var url = location.href.split('#')[0].split('?')[0];
  var t = document.getElementById('toast');
  function toast(m){t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1800)}
  function fallback(){var i=document.createElement('input');i.value=url;document.body.appendChild(i);i.select();try{document.execCommand('copy');toast('Lien copié')}catch(e){}i.remove()}
  function copy(){if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){toast('Lien copié')},fallback)}else fallback()}
  function share(){
    if(navigator.share){navigator.share({title:'Stéphanie Hugon · AHOMI World',text:'Carte de visite de Stéphanie Hugon — Chief Operating Officer for Development, AHOMI World Group',url:url}).catch(function(){})}
    else copy();
  }
  document.getElementById('copy').onclick=copy;
  document.getElementById('share').onclick=share;
  document.getElementById('share2').onclick=share;
})();
</script>
