<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stéphanie Hugon · AHOMI World</title>
<meta name="description" content="Stéphanie Hugon, Chief Operating Officer for Development — AHOMI World Group. Isabelle Bartoli, Designer and Founder.">
<meta property="og:title" content="Stéphanie Hugon · AHOMI World">
<meta property="og:description" content="Chief Operating Officer for Development — AHOMI World Group">
<meta property="og:image" content="carte.jpg">
<meta name="theme-color" content="#f3dbc3">
<link rel="icon" href="icon.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Jost:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e3d1;--ink:#3f2a14;--soft:#8c7154;--gold:#b08443}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:"Jost",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.wrap{width:100%;max-width:480px;padding-bottom:40px;text-align:center}
.card{position:relative;line-height:0}
.card img{display:block;width:100%;height:auto}
.hot{position:absolute;display:block;border-radius:8px;-webkit-tap-highlight-color:rgba(176,132,67,.25)}
.save{display:inline-block;margin:26px auto 0;padding:16px 32px;border-radius:999px;
  background:linear-gradient(120deg,#8a6224,#c9a058 30%,#f1d89c 52%,#c9a058 74%,#8a6224);background-size:220% 100%;
  color:#fffaf1;font-family:"Cinzel",serif;font-weight:600;font-size:13px;letter-spacing:.16em;text-decoration:none;
  text-shadow:0 1px 1px rgba(74,47,18,.4);box-shadow:0 12px 26px -14px rgba(138,98,36,.9);transition:background-position .6s}
.save:hover{background-position:100% 0}
.links{margin-top:18px;font-size:14px;color:var(--soft);letter-spacing:.04em}
.links a,.links button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:4px 2px;text-decoration:none}
.links i{font-style:normal;padding:0 10px;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--ink);color:#fbe9cf;font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <img src="carte.jpg" alt="AHOMI World — Isabelle Bartoli, Designer and Founder · Stéphanie Hugon, Chief Operating Officer for Development · +33 6 27 03 56 88 · +212 6 77 36 16 63 · ahomiworld@gmail.com" width="941" height="1672">
    <a class="hot" href="tel:+33627035688" aria-label="Appeler +33 6 27 03 56 88" style="left:29%;top:72.9%;width:47%;height:3.7%"></a>
    <a class="hot" href="tel:+212677361663" aria-label="Appeler +212 6 77 36 16 63" style="left:29%;top:76.7%;width:49%;height:3.5%"></a>
    <a class="hot" href="mailto:ahomiworld@gmail.com" aria-label="Écrire à ahomiworld@gmail.com" style="left:28.5%;top:80.3%;width:55%;height:3.4%"></a>
  </div>

  <a class="save" href="contact.vcf" download="Stephanie-Hugon.vcf">ENREGISTRER LE CONTACT</a>

  <p class="links">
    <a href="https://wa.me/212677361663?text=Bonjour%20St%C3%A9phanie%2C%20" target="_blank" rel="noopener">WhatsApp</a><i>·</i><button type="button" id="share">Partager</button>
  </p>
</main>
<div class="toast" id="toast">Lien copié</div>
<script>
(function(){
  var url=location.href.split('#')[0].split('?')[0],t=document.getElementById('toast');
  function copy(){try{navigator.clipboard.writeText(url).then(function(){t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1800)})}catch(e){}}
  document.getElementById('share').onclick=function(){
    if(navigator.share){navigator.share({title:'Stéphanie Hugon · AHOMI World',url:url}).catch(function(){})}else copy();
  };
})();
</script>
</body>
</html>
